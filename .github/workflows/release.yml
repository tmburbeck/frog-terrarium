# Release: makes a Windows build for players and publishes it.
#
# Start it by pushing a version tag (git tag v0.5.0 && git push origin v0.5.0) or from the
# Actions tab ("Release" > "Run workflow"). It:
#   1. builds the game for Windows, stamped with the version,
#   2. zips it and attaches the zip to a GitHub Release (a download link that does not expire),
#   3. uploads it to itch.io with butler, but only if the BUTLER_API_KEY secret and the
#      ITCH_TARGET variable are set (see docs/RELEASING.md). Without them, step 3 is skipped.
#
# Needs the same Unity secrets as CI (docs/CI_SETUP.md).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the build, for example 0.5.0 (no leading v)
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish (Windows)
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Work out the version
        id: version
        run: |
          v="${VERSION#v}"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not a version like 0.5.0"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Simulation tests must pass before anything is published
        run: dotnet test tools/SimCoreTests/SimCoreTests.csproj
      - name: Free disk space for the Unity image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-StandaloneWindows64-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          # Keep in step with ci.yml when ProjectVersion.txt changes.
          customImage: unityci/editor:ubuntu-6000.3.29f1-windows-mono-4
          buildMethod: FrogTerrarium.EditorTools.BuildScript.Build
          buildName: FrogTerrarium
          versioning: Custom
          version: ${{ steps.version.outputs.version }}
      - name: Zip the game
        run: |
          cd build/StandaloneWindows64
          # Debug symbols are for us, not players.
          rm -rf *_BurstDebugInformation_DoNotShip *_BackUpThisFolder_ButDontShipItWithYourGame
          cp ../../docs/PLAYERS_README.txt "Read me.txt"
          zip -qr "../../FrogTerrarium-${{ steps.version.outputs.version }}-windows.zip" .
      - name: Attach to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Frog Terrarium ${{ steps.version.outputs.version }}
          files: FrogTerrarium-${{ steps.version.outputs.version }}-windows.zip
          generate_release_notes: true
      - name: Upload to itch.io (only if set up)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_TARGET" ]; then
            echo "::notice title=itch.io upload skipped::Set the BUTLER_API_KEY secret and the ITCH_TARGET variable to upload releases to itch.io. See docs/RELEASING.md."
            exit 0
          fi
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push build/StandaloneWindows64 "$ITCH_TARGET:windows" --userversion "${{ steps.version.outputs.version }}"
